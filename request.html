<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LONTAR - Permintaan Nomor Surat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #999999);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px 16px 32px;
  }
  h2 { font-size: 19px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 20px; }
  .badge {
    display: inline-block;
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  label { display: block; font-size: 13px; margin-top: 16px; margin-bottom: 6px; font-weight: 600; }
  input, textarea {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #d8d8dc;
    font-size: 15px;
    background: var(--secondary-bg);
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 72px; font-family: inherit; }
  button {
    margin-top: 26px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 16px;
    font-weight: 600;
  }
  button:disabled { opacity: 0.6; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }
  #status.error { color: #d33; }
  #status.success { color: #1a9e4b; }
  #blocked {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  #blocked h3 { font-size: 17px; }
  #blocked p { color: var(--hint); font-size: 14px; }
</style>
</head>
<body>

  <div id="app">
    <span class="badge" id="jenisBadge">Memuat...</span>
    <h2 id="judul">Form Permintaan Nomor</h2>
    <div class="sub">LONTAR Bot &mdash; Disbudpar Jatim</div>

    <form id="reqForm">
      <label>Perihal Surat</label>
      <input type="text" id="perihal" required placeholder="cth: Undangan Rapat Koordinasi">

      <label>Tujuan Surat</label>
      <input type="text" id="tujuan" required placeholder="cth: Kepala Dinas Pariwisata Kab. X">

      <label>Tanggal Surat</label>
      <input type="date" id="tanggalSurat" required>

      <label>Catatan (opsional)</label>
      <textarea id="catatan" placeholder="Catatan tambahan"></textarea>

      <button type="submit" id="submitBtn">Kirim Permintaan</button>
    </form>
    <div id="status"></div>
  </div>

  <div id="blocked">
    <h3>🔒 Akses Ditolak</h3>
    <p>Halaman ini hanya bisa diakses melalui LONTAR Bot di Telegram.</p>
  </div>

<script>
  // ====== KONFIGURASI (WAJIB DIGANTI SEBELUM DEPLOY) ======
  const SUBMIT_BASE_URL = 'https://GANTI-DOMAIN-N8N-LU/webhook/webapp';

  // ====== Tentuin jenis surat dari PATH URL (bukan query string) ======
  // Vercel rewrite ga expose query tujuan ke browser, jadi baca dari pathname
  // yang emang keliatan asli di address bar: /nomorsurat atau /notdin
  const pathMap = { '/nomorsurat': 'nomorsurat', '/notdin': 'notdin' };
  const jenis = pathMap[window.location.pathname.replace(/\/$/, '')] || '';
  const labelMap = { nomorsurat: 'Surat Keluar', notdin: 'Nota Dinas' };

  const tg = window.Telegram && window.Telegram.WebApp;

  function tampilkanBlocked() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('blocked').style.display = 'block';
  }

  // CATATAN: ini cuma UX gate di client, BUKAN keamanan.
  // Keamanan sebenarnya divalidasi di server (HMAC initData) pas submit.
  if (!labelMap[jenis] || !tg || !tg.initData) {
    tampilkanBlocked();
  } else {
    tg.ready();
    tg.expand();

    document.getElementById('jenisBadge').textContent = labelMap[jenis];
    document.getElementById('judul').textContent = `Permintaan Nomor ${labelMap[jenis]}`;

    document.getElementById('reqForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('submitBtn');
      statusEl.className = '';
      statusEl.textContent = 'Mengirim...';
      btn.disabled = true;

      const payload = {
        initData: tg.initData,
        perihal: document.getElementById('perihal').value,
        tujuan: document.getElementById('tujuan').value,
        tanggalSurat: document.getElementById('tanggalSurat').value,
        catatan: document.getElementById('catatan').value
      };

      try {
        const res = await fetch(`${SUBMIT_BASE_URL}/${jenis}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          statusEl.className = 'success';
          statusEl.textContent = data.message || 'Berhasil! Nomor akan dikirim via bot.';
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          setTimeout(() => tg.close(), 1500);
        } else {
          statusEl.className = 'error';
          statusEl.textContent = data.message || 'Gagal mengirim permintaan.';
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          btn.disabled = false;
        }
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Gagal terhubung ke server. Coba lagi.';
        btn.disabled = false;
      }
    });
  }
</script>
</body>
</html>
